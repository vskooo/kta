<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div class="overlay" (click)="onOverlayClick($event)">
  <div
    class="card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="result-title"
  >
    <button
      type="button"
      class="card-close"
      [attr.aria-label]="texts.closeButton"
      (click)="dismissed.emit()"
    >
      &times;
    </button>
    <p class="card-kicker">{{ texts.resultTitle }}</p>
    <p class="card-emoji" aria-hidden="true">
      {{ result().selectedPlan.emoji ?? '✨' }}
    </p>
    <h2 id="result-title" class="card-title">
      {{ result().selectedPlan.title }}
    </h2>
    @if (result().selectedPlan.description; as description) {
      <p class="card-description">{{ description }}</p>
    }

    @if (decided()) {
      <p class="card-accepted">{{ texts.acceptedTitle }}</p>
      <p class="card-description">{{ texts.acceptedMessage }}</p>
      <button
        type="button"
        class="card-button card-button-secondary"
        (click)="spinAgain.emit()"
      >
        {{ texts.spinAgainButton }}
      </button>
    } @else {
      <p class="card-prompt">{{ texts.resultPrompt }}</p>
      <div class="card-actions">
        <button type="button" class="card-button" (click)="accepted.emit()">
          {{ texts.acceptButton }}
        </button>
        <button
          type="button"
          class="card-button card-button-secondary"
          (click)="spinAgain.emit()"
        >
          {{ texts.spinAgainButton }}
        </button>
      </div>
    }
  </div>
</div>
